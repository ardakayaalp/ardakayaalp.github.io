# ---------------------------------------------------------------------------
# Site settings. Restart `jekyll serve` after editing this file.
# ---------------------------------------------------------------------------
title: Arda Kayaalp
tagline: Doctoral Researcher in Physics
description: >-
  Arda Kayaalp, doctoral researcher in experimental nuclear physics at KU Leuven.
  Research, publications, project updates and photography.
url: https://ardakayaalp.com
baseurl: ""
lang: en
timezone: Europe/Brussels

author:
  name: Arda Kayaalp
  role: Doctoral Researcher
  employer: KU Leuven
  employer_url: https://fys.kuleuven.be/iks/nm/home
  location: Leuven, Belgium
  email: arda.kayaalp@kuleuven.be
  avatar: /images/profile.jpg

# Links shown in the Start menu, the About window and the footer.
# Remove a line to hide it. `icon` refers to a symbol in _includes/icons.svg
social:
  - { name: Google Scholar, url: "https://scholar.google.com/citations?user=Iy0mt_oAAAAJ&hl=en", icon: scholar }
  - { name: ORCID,          url: "https://orcid.org/0000-0002-8305-3073",                        icon: orcid }
  - { name: ResearchGate,   url: "https://www.researchgate.net/profile/Arda-Kayaalp-2",          icon: researchgate }
  - { name: GitHub,         url: "https://github.com/ardakayaalp",                               icon: github }
  - { name: LinkedIn,       url: "https://www.linkedin.com/in/arda-kayaalp",                     icon: linkedin }
  - { name: Instagram,      url: "https://www.instagram.com/rdkylphoto",                         icon: instagram }

# Analytics + search console (carried over from the old site)
google_analytics: G-4HSBFZ7B2T
google_site_verification: bHq-u2VY65WzGecsb6qBkvSy3ITfpdsvM3cO4HRfl8E

# How many updates to show on the home page
home_updates: 3

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
collections:
  albums:
    output: true
    permalink: /gallery/:name/
    sort_by: date

defaults:
  # Updates: one folder per update, e.g. updates/2026-10-02-beam-time/update.md (+ figures/).
  # The folder name gives the date, the order and the URL (/updates/2026-10-02-beam-time/).
  - scope: { path: "updates" }
    values: { layout: post, update: true, permalink: "/:path/" }
  - scope: { path: "", type: albums }
    values: { layout: album }
  - scope: { path: "_pages" }
    values: { layout: page }
  # Every photo inside images/albums is flagged so album pages can list them
  - scope: { path: "images/albums" }
    values: { album_photo: true }

include: [_pages]
exclude:
  - "*.cmd"
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - vendor
  - node_modules
  - "*.py"

# ---------------------------------------------------------------------------
# Build (all of these are supported by GitHub Pages)
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge


plugins:
  - jekyll-optional-front-matter   # a dropped-in .md file works without front matter
  - jekyll-titles-from-headings     # ...its first "# Heading" becomes the title
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from


sass:
  style: compressed

titles_from_headings:
  strip_title: true
