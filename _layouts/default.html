<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="{% if page.layout == 'home' %}page-home{% else %}page-inner{% endif %}">
{% include icons.svg %}
<a class="skip-link" href="#main">Skip to content</a>

<div class="desktop">
  {% include desktop-icons.html %}
  <main id="main" class="workspace">
{{ content }}
  </main>
</div>

{% include taskbar.html %}
{% include dialogs.html %}

<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% if page.layout == 'album' %}<script src="{{ '/assets/js/lightbox.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
{% if page.update %}<script src="{{ '/assets/js/crossref.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
{% if page.url contains '/updates/' %}<script src="{{ '/assets/js/updates.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
</body>
</html>
