<nav class="desktop-icons" aria-label="Sections">
  {%- for item in site.data.navigation %}
  <a class="desktop-icon" href="{{ item.url | relative_url }}"{% if item.new_tab %} target="_blank" rel="noopener"{% endif %}>
    {%- if item.image %}
    <img class="icon icon-32" src="{{ item.image | relative_url }}" width="32" height="32" alt="">
    {%- else %}
    <svg class="icon icon-32" aria-hidden="true"><use href="#i-{{ item.icon }}"/></svg>
    {%- endif %}
    <span>{{ item.desktop_label | default: item.title }}</span>
  </a>
  {%- endfor %}
</nav>
